# Deploys the Cloudflare Worker that is the shop's one public origin (edge/) to staging, then checks
# every unit through it. Runs on a push to main that changes the Worker, or by hand from any branch:
# the FES URLs it routes to are fixed per service, so Shell, Catalog and Cart deploys do not need it.
# Deploy every unit's FES before the first run. Identifiers come from GitHub variables and secrets.
name: Deploy the Worker to staging

on:
  push:
    branches: [main]
    paths: ['edge/**', '.github/workflows/deploy-edge-staging.yml']
  workflow_dispatch:

# Shared with deploy-staging.yml, so the Worker never deploys while the Shell is deploying.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  # Workload identity federation, only to read the FES URLs from Cloud Run.
  id-token: write

env:
  ENVIRONMENT: staging

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: false
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint edge
      - run: pnpm --filter @shop-shell/edge typecheck
      - run: pnpm --filter @shop-shell/edge test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: false
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3.0.1

      # The FES URLs are read from Cloud Run, not stored.
      - name: Deploy the Worker (public origin)
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fes() {
            gcloud run services describe "$1-fes-$ENVIRONMENT" --project "$PROJECT" --region "$REGION" \
              --format 'value(status.url)'
          }
          pnpm exec wrangler whoami
          pnpm exec wrangler deploy --env "$ENVIRONMENT" \
            --var "SHELL_URL:$(fes shell)" \
            --var "MFE_CATALOG_URL:$(fes catalog)" \
            --var "MFE_CART_URL:$(fes cart)"

      - name: Check the public origin
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          failed=0
          check() {
            status=000
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_ORIGIN$2" || true)
              [ "$status" = "$1" ] && break
              sleep 10
            done
            echo "$2 -> $status"
            [ "$status" = "$1" ] || failed=1
          }
          for path in / /catalog /api/shell/greeting /api/catalog/products /api/cart \
            /mfe/catalog/entry.js /mfe/cart/entry.js; do
            check 200 "$path"
          done
          check 404 /health/ready
          check 404 /version
          exit $failed
