# Publishes @arun-shop/shell-stub to npm with trusted publishing (OIDC): no token. Push a tag
# `shell-stub-v<version>` matching packages/shell-stub/package.json. npmjs.com names this file as the
# package's trusted publisher, so renaming it breaks publishing.
name: Release shell-stub

on:
  push:
    tags: ['shell-stub-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/shell-stub/package.json').version")
          test "${GITHUB_REF_NAME}" = "shell-stub-v${version}"
      - run: pnpm --filter @arun-shop/shell-stub test
      # pnpm pack builds (prepack) and swaps catalog: versions for real ones; npm publishes with OIDC.
      - run: pnpm --filter @arun-shop/shell-stub pack --pack-destination "$RUNNER_TEMP"
      - run: npm publish "$RUNNER_TEMP"/arun-shop-shell-stub-*.tgz --access public --provenance
