# Shell's settings in the tenant's identity provider (Keycloak realm OIDC_REALM, default shop), applied
# by shop-mfe-platform's settings importer (keycloak-config-cli). Secrets come from keycloak/.env.
# PUBLIC_ORIGIN is the tenant's shop; DEV_ORIGIN a second allowed origin: the Shell's development server
# for the default tenant, the tenant's own origin otherwise (shop-mfe-platform's compose.sso.yaml).
realm: $(env:OIDC_REALM)

clients:
  # The one login client: only the Shell FES signs users in.
  - clientId: shell-fes
    protocol: openid-connect
    publicClient: false
    secret: $(env:SHELL_FES_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - $(env:PUBLIC_ORIGIN)/auth/callback
      - $(env:DEV_ORIGIN)/auth/callback
    webOrigins:
      - $(env:PUBLIC_ORIGIN)
      - $(env:DEV_ORIGIN)
    attributes:
      pkce.code.challenge.method: S256
      client.use.lightweight.access.token.enabled: 'true'
      post.logout.redirect.uris: $(env:PUBLIC_ORIGIN)/auth/logged-out##$(env:DEV_ORIGIN)/auth/logged-out
    protocolMappers:
      # Keycloak leaves sub out of lightweight access tokens unless a mapper adds it there.
      - name: sub in lightweight tokens
        protocol: openid-connect
        protocolMapper: oidc-sub-mapper
        config:
          access.token.claim: 'true'
          introspection.token.claim: 'true'
          lightweight.claim: 'true'
      # Puts a unit's backend in `aud` when the user holds one of its roles, also in lightweight tokens.
      - name: audience resolve
        protocol: openid-connect
        protocolMapper: oidc-audience-resolve-mapper
        config:
          access.token.claim: 'true'
          introspection.token.claim: 'true'
          lightweight.claim: 'true'

  - clientId: shell-backend
    protocol: openid-connect
    publicClient: false
    secret: $(env:SHELL_BACKEND_SECRET)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    # The realm's usual default scopes, named because a client created with only optionalClientScopes
    # gets none of them (a new realm, e.g. a new tenant's): without roles, its service tokens carry no
    # roles and no audience.
    defaultClientScopes: [service_account, web-origins, acr, profile, roles, basic, email]
    # Keycloak 26.8's admin API takes only tokens with this scope. Optional: the backend asks for it only
    # for admin API calls, so tokens it sends to other backends never carry admin API rights.
    optionalClientScopes: [kc-admin-api]

roles:
  client:
    shell-backend:
      - name: shell-user
        description: May use the Shell

# Roles are granted through the Shell's own groups: several repositories' files name the same users,
# and only group memberships merge across files.
groups:
  - name: shell
    subGroups:
      - name: user
        clientRoles:
          shell-backend: [shell-user]

users:
  # Lets the backend read users by sub.
  - username: service-account-shell-backend
    clientRoles:
      realm-management: [view-users]
  - username: alice
    groups: [/shell/user]
  - username: bob
    groups: [/shell/user]
