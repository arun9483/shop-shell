packages:
  - client
  - fes
  - mock-backend
  - edge
  - server-common
  - packages/*
  - tests/e2e

# Shared versions. The Shell client and the Shell stub must load the same design-system CSS and
# single-spa, so MFEs see the same page whether they run in the Shell or standalone.
catalog:
  '@arun-dev/headless': 4.28.1
  '@arun-dev/tokens': 1.0.0
  '@arun-dev/ui': 5.14.2
  '@newrelic/browser-agent': 1.324.0
  single-spa: 6.0.3
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

saveExact: true

# Supply-chain buffer: a version is installed only once it is a day old (pnpm 11's default).
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  # Optional New Relic native add-ons (CPU and GC metrics); the agent works without them.
  '@newrelic/fn-inspect': false
  '@newrelic/native-metrics': false
  protobufjs: false
  # Cloudflare's local runtime, used only by `wrangler dev`; deploys just bundle the Worker.
  workerd: false
