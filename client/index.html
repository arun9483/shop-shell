<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The saved theme, applied before the first paint so the page never flashes the other theme: themeNoFlashScript() from @arun-dev/client (src/theme.test.ts runs it). -->
    <script>
      try {
        const t = localStorage.getItem('shop-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="shell-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
